<app-card>
  <div *ngIf="loading" class="report-state report-state-loading">
    <app-loadingspinner2></app-loadingspinner2>
    <span>Loading violation data…</span>
  </div>
  <h1 class="h5 dashheadding">Violation</h1>
  <div *ngIf="!loading">
      <div *ngIf="violationamountarr.length===0" class="report-state"><strong>No violation data</strong><span>There are no violations for the selected period.</span></div>
    </div>
  <div class="graph" >
    <canvas id="bar-chart-horizontal"></canvas>
  </div>

  <!-- </div> -->
</app-card>
