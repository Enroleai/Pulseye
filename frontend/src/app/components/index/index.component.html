<app-topnav></app-topnav>
<app-sidenavbar></app-sidenavbar>

<main class="main-container" aria-labelledby="dashboard-title">
  <div class="dashboard-shell">
    <section class="dashboard-heading">
      <div>
        <p class="eyebrow">PULSEYE MONITORING</p>
        <h1 id="dashboard-title">Operations dashboard</h1>
        <p class="dashboard-subtitle">A clear view of productivity, activity, and employee health across your workspace.</p>
      </div>
      <div class="dashboard-heading-badge" aria-label="Dashboard status">
        <span class="pulse-dot"></span>
        Live workspace
      </div>
    </section>

    <section class="dashboard-announcement" aria-label="Pulseye updates">
      <div class="announcement-icon"><i class="fa fa-bolt" aria-hidden="true"></i></div>
      <div class="announcement-copy">
        <strong>Pulseye employee monitoring</strong>
        <span>Track productivity signals and policy activity from one place.</span>
      </div>
      <a routerLink="/latestsnapshots" class="announcement-link">View snapshots <i class="fa fa-arrow-right" aria-hidden="true"></i></a>
    </section>

    <section class="dashboard-controls" aria-label="Dashboard controls">
      <div class="date-control">
        <span class="control-label">Reporting period</span>
        <div id="reportrange">
          <app-drpicker style="cursor: pointer"></app-drpicker>
        </div>
      </div>
      <div class="status-picker" aria-label="Employee availability">
        <button type="button" class="status-card status-card-online" (click)="scroll()">
          <span class="status-label"><span class="status-dot status-dot-blue"></span>Online</span>
          <strong>{{ online }}</strong>
        </button>
        <div class="status-card status-card-offline">
          <span class="status-label"><span class="status-dot status-dot-slate"></span>Offline</span>
          <strong>{{ offline }}</strong>
        </div>
        <div class="status-card status-card-away">
          <span class="status-label"><span class="status-dot status-dot-yellow"></span>Away</span>
          <strong>0</strong>
        </div>
      </div>
    </section>

    <section class="dashboard-grid dashboard-grid-primary" aria-label="Primary analytics">
      <div class="dashboard-chart-shell"><app-productivitygraph></app-productivitygraph></div>
      <div class="dashboard-chart-shell"><app-violationgraph></app-violationgraph></div>
    </section>

    <section class="dashboard-grid" aria-label="Activity overview">
      <div class="dashboard-chart-shell"><app-latestsnapshot></app-latestsnapshot></div>
      <div class="dashboard-chart-shell"><app-activitylog></app-activitylog></div>
    </section>

    <section class="dashboard-grid" aria-label="Usage analytics">
      <div class="dashboard-chart-shell"><app-appusagegraph></app-appusagegraph></div>
      <div class="dashboard-chart-shell"><app-webusagegraph></app-webusagegraph></div>
    </section>

    <section class="dashboard-wide-card" id="last-card" aria-label="Online employees">
      <app-onlineemp></app-onlineemp>
    </section>
  </div>
</main>
