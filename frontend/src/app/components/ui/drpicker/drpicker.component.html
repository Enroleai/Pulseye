<div class="datepickcontainer">
  <div class="form-group">
    <div class="input-group modern-date-picker">
      <input
        type="text"
        name="daterangeInput"
        ngxDaterangepickerMd
        startKey="start"
        endKey="end"
        [(ngModel)]="selected"
        [ranges]="ranges"
        [locale]="locale"
        (datesUpdated)="selectedDate($event)"
        class="form-control left-datepick"
        readonly
      />
      <span class="input-group-text" aria-hidden="true">
        <i class="fa fa-calendar"></i>
      </span>
    </div>
  </div>
</div>
