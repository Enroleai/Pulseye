<div class="live-page">
  <header class="live-header">
    <div class="live-meta">
      <div><span class="meta-label">Name</span><strong>{{ name || 'Waiting for employee' }}</strong></div>
      <div><span class="meta-label">System</span><strong>{{ systemid || '—' }}</strong></div>
      <div><span class="meta-label">Activity date</span><strong>{{ date }}</strong></div>
    </div>
    <div class="live-pill"><span></span> Live</div>
  </header>
  <main class="live-content">
    <ng-container *ngIf="image; else waitingState">
      <img [src]="image" alt="Employee activity" class="activity-image" />
    </ng-container>
    <ng-template #waitingState>
      <section class="live-empty" aria-live="polite">
        <div class="empty-icon"><i class="fa fa-desktop" aria-hidden="true"></i></div>
        <h1>Waiting for activity</h1>
        <p>The live activity image will appear here when this employee sends an update.</p>
      </section>
    </ng-template>
  </main>
</div>
